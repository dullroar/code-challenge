import org.springframework.boot.gradle.tasks.run.BootRun

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.3.21'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'challenge1'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Keeps the Kotlin libraries on the plugin's version; Spring Boot's BOM would otherwise pull its own.
ext['kotlin.version'] = '2.3.21'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    runtimeOnly 'org.hibernate.orm:hibernate-community-dialects'
    runtimeOnly 'org.xerial:sqlite-jdbc'
}

def kotlinMain = 'challenge1.kotlinversion.ProgramKt'

springBoot {
    mainClass = kotlinMain
}

tasks.register('runKotlin', BootRun) {
    group = 'application'
    description = 'Runs the Kotlin version of the one-statement program.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = kotlinMain
}

// sqlite-jdbc loads a native library. The working directory fixes where data/ is created.
tasks.withType(BootRun).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    workingDir = projectDir
}
