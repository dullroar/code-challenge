name: PDF release gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
      - name: Install PDF and diagram build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-dejavu libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          python3 -m venv "$RUNNER_TEMP/weird-way-pdf"
          source "$RUNNER_TEMP/weird-way-pdf/bin/activate"
          python -m pip install -r lessons/book/requirements-pdf-lint.txt 'weasyprint==70.0'
          echo "$RUNNER_TEMP/weird-way-pdf/bin" >> "$GITHUB_PATH"

          cd lessons/book/diagrams
          PUPPETEER_SKIP_DOWNLOAD=1 npm ci
          version=147.0.7727.15
          browser_dir="$RUNNER_TEMP/weird-way-browser"
          node_modules/.bin/browsers install "chrome-headless-shell@$version" --path "$browser_dir"
          browser="$browser_dir/chrome-headless-shell/linux-$version/chrome-headless-shell-linux64/chrome-headless-shell"
          test -x "$browser"
          echo "MERMAID_CHROME=$browser" >> "$GITHUB_ENV"
          echo "MERMAID_NO_SANDBOX=1" >> "$GITHUB_ENV"

      - name: Check book sources and study guides
        run: |
          python lessons/book/build.py --check
          python lessons/study-guides/build.py --check
          python lessons/curriculum/build.py --check

      - name: Run editorial regression checks
        run: |
          python lessons/book/test_cs.py
          python lessons/book/test_study_guides.py
          python lessons/book/test_curriculum.py
          python lessons/book/test_editorial.py
          python lessons/book/test_repo_links.py
          python lessons/book/test_repo_identity.py

      - name: Run the full Mermaid render gate
        run: python lessons/book/build.py --check-diagrams

      - name: Run PDF regression fixtures
        run: python lessons/book/test_pdf_lint.py

      - name: Build and lint both PDFs
        run: |
          artifacts=lessons/book/out/pdf-lint/ci-release
          status=0
          python lessons/book/build.py --release --artifacts-dir "$artifacts" || status=1
          python lessons/study-guides/build.py --release --artifacts-dir "$artifacts" || status=1
          python lessons/curriculum/build.py --release --artifacts-dir "$artifacts" || status=1
          exit "$status"

      - name: Upload PDF lint findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-lint-findings
          path: |
            lessons/book/out/pdf-lint/*/report.json
            lessons/book/out/pdf-lint/*/pages/*.png
